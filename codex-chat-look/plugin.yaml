name: codex-chat-look
version: "1.9.5"
description: >-
  A Codex-inspired look for Hermes Desktop, with refined chat, sidebar and
  browser styling, native theme support, and optional clean transcript and
  composer settings. Keeps Hermes' native controls and behavior.
  Local Catppuccin Latte/Mocha palette with peach accents. Compatibility build
  based on upstream v1.8.2; upstream one-click replacement is disabled to
  preserve the custom palette and titlebar settings.
author: FPSUnleashed
kind: standalone
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
